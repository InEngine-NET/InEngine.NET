[workspace]
members = ["inengine", "inengine-core"]
exclude = ["sample-plugin", "fixture-plugin"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
inengine-core = { path = "inengine-core" }
chrono = "0.4"
serde_json = "1"
tempfile = "3"
tokio = "1"
tokio-util = "0.7"
tracing = "0.1"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unreachable_pub = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
