[package]
name = "inengine-core"
version.workspace = true
edition.workspace = true

[lints]
workspace = true

[features]
integration = []

[dependencies]
base64 = "0.23"
chrono = { workspace = true, features = ["serde"] }
cron = "0.17"
crossterm = "0.29"
flate2 = "1"
indicatif = "0.18"
lettre = { version = "0.11", default-features = false, features = ["builder", "hostname", "smtp-transport", "native-tls", "tokio1-native-tls"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
redis = { version = "1.7", features = ["tokio-comp", "connection-manager", "script"] }
serde = { version = "1", features = ["derive"] }
serde_json = { workspace = true }
thiserror = "2"
tokio = { workspace = true, features = ["fs", "io-util", "time", "rt", "rt-multi-thread", "macros", "sync"] }
tokio-util = { workspace = true }
tracing = { workspace = true }
uuid = { version = "1", features = ["serde", "v4", "v7"] }
wasmtime = { version = "49", features = ["component-model"] }
confval = { version = "0.12.0", features = ["derive", "toml", "color"] }

[dev-dependencies]
tempfile = { workspace = true }
tokio = { workspace = true, features = ["time", "rt", "macros", "sync"] }
