[package]
name = "inengine-core"
version = "0.1.0"
edition = "2021"

[features]
integration = []

[dependencies]
base64 = "0.23"
chrono = { version = "0.4", features = ["serde"] }
cron = "0.17"
crossterm = "0.29"
flate2 = "1"
indicatif = "0.18"
lettre = { version = "0.11", features = ["tokio1-native-tls"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
redis = { version = "1.7", features = ["tokio-comp"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
thiserror = "2"
tokio = { version = "1", features = ["process", "time", "rt", "sync"] }
tokio-util = "0.7"
tracing = "0.1"
uuid = { version = "1", features = ["v4"] }
wasmtime = { version = "49", features = ["component-model"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["process", "time", "rt", "macros", "sync"] }
