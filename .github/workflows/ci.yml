name: CI

permissions:
  contents: read

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    name: Validate (lint, docs, test)
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:8
        ports:
          - 6390:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 15
    env:
      RUSTFLAGS: "-C link-arg=-fuse-ld=mold"
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: sccache
      INENGINE_TEST_REDIS_PORT: "6390"

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install mold
        run: sudo apt-get update -y && sudo apt-get install -y mold

      - name: Configure sccache
        uses: mozilla-actions/sccache-action@v0.0.11

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: validation

      - name: Install tools
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest,cargo-machete

      - name: cargo fmt
        run: cargo fmt --all --check

      - name: cargo machete
        run: cargo machete

      - name: cargo clippy
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

      - name: cargo doc
        run: cargo doc --locked --workspace --all-features --no-deps
        env:
          RUSTDOCFLAGS: "-D warnings"

      # bindgen! in inengine-core reads the WIT file, so a package that leaves it out cannot build.
      - name: Check the inengine-core package
        run: |
          cargo check --locked -p inengine-core --all-targets
          cargo package --locked -q -p inengine-core --list --allow-dirty | grep -qx wit/plugin.wit

      - name: Run tests
        run: cargo nextest run --locked --workspace --all-features

  plugins:
    name: Plugins (sample, fixture)
    runs-on: ubuntu-latest
    env:
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: sccache

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Configure sccache
        uses: mozilla-actions/sccache-action@v0.0.11

      # cargo-component has no prebuilt binary, so the cache keeps the one that cargo install builds.
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: plugins
          workspaces: |
            sample-plugin
            fixture-plugin

      - name: Install cargo-component
        run: cargo install cargo-component --locked

      - name: Build the sample plugin
        working-directory: sample-plugin
        run: cargo component build --locked --release --target wasm32-unknown-unknown

      # The checked-in fixtures embed paths from the machine that built them, so CI checks
      # that the source builds rather than comparing bytes.
      - name: Build the fixture plugin
        working-directory: fixture-plugin
        run: |
          cargo component build --locked --release --target wasm32-unknown-unknown --features spin-on-load
          cargo component build --locked --release --target wasm32-unknown-unknown

  build:
    name: Build (${{ matrix.target }})
    runs-on: ubuntu-latest
    needs: [ validate, plugins ]
    env:
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: sccache
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-musl
          - aarch64-unknown-linux-musl

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: "0.16.0"

      - name: Configure sccache
        uses: mozilla-actions/sccache-action@v0.0.11

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install cargo-zigbuild
        uses: taiki-e/install-action@cargo-zigbuild

      - name: Build with zigbuild
        run: cargo zigbuild --release --locked -p inengine --target ${{ matrix.target }}

      - name: Upload binary
        uses: actions/upload-artifact@v7
        with:
          name: inengine-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/inengine
