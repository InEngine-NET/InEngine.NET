name: CI

permissions:
  contents: read

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
  schedule:
    # Runs weekly without a push, so a new advisory or a new stable toolchain lint shows up.
    - cron: "0 6 * * 1"

# A new push to a pull request stops its older run. Runs on main all finish, so each one updates the badges.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  validate:
    name: Validate (lint, docs, test)
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:8
        ports:
          - 6390:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 15
    env:
      RUSTFLAGS: "-C link-arg=-fuse-ld=mold"
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: sccache

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install mold
        run: sudo apt-get update -y && sudo apt-get install -y mold

      - name: Configure sccache
        uses: mozilla-actions/sccache-action@v0.0.11

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: validation

      - name: Install just
        uses: extractions/setup-just@v4

      - name: Install tools
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest,cargo-machete,cargo-deny

      - name: Lint
        run: just fmt-check machete deny clippy

      - name: Docs
        run: just doc

      - name: Check the inengine-core package
        run: just check-core-package

      - name: Run tests
        run: just integration-test-only

  plugins:
    name: Plugins (sample, fixture)
    runs-on: ubuntu-latest
    env:
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: sccache

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Configure sccache
        uses: mozilla-actions/sccache-action@v0.0.11

      # cargo-component has no prebuilt binary, so the cache keeps the one that cargo install builds.
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: plugins
          workspaces: |
            sample-plugin
            fixture-plugin

      - name: Install just
        uses: extractions/setup-just@v4

      - name: Install cargo-component
        run: cargo install cargo-component --locked

      # The checked-in fixtures embed paths from the machine that built them, so CI checks
      # that the source builds rather than comparing bytes.
      - name: Build the plugins
        run: just build-sample-plugin build-fixture-plugin

  build:
    name: Build (${{ matrix.target }})
    runs-on: ubuntu-latest
    needs: [ validate, plugins ]
    env:
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: sccache
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-musl
          - aarch64-unknown-linux-musl

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: "0.16.0"

      - name: Configure sccache
        uses: mozilla-actions/sccache-action@v0.0.11

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install cargo-zigbuild
        uses: taiki-e/install-action@cargo-zigbuild

      - name: Build with zigbuild
        run: cargo zigbuild --release --locked -p inengine --target ${{ matrix.target }}

      - name: Upload binary
        uses: actions/upload-artifact@v7
        with:
          name: inengine-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/inengine

  badges:
    name: Badges (tests, coverage)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [ validate ]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    services:
      redis:
        image: redis:8
        ports:
          - 6390:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: coverage

      - name: Install just
        uses: extractions/setup-just@v4

      - name: Install tools
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest,cargo-llvm-cov

      - name: Measure coverage
        run: just coverage-percent

      - name: Generate badge JSON
        run: |
          mkdir -p badges
          jq -n --arg count "$(just count-tests)" \
            '{schemaVersion: 1, label: "tests", message: ($count + " passed"), color: "brightgreen"}' \
            > badges/tests.json
          jq -n --arg pct "$(cat target/coverage-percent)" \
            '{schemaVersion: 1, label: "coverage", message: ($pct + "%"), color: (
              if ($pct | tonumber) >= 80 then "brightgreen"
              elif ($pct | tonumber) >= 60 then "yellow"
              else "red" end)}' \
            > badges/coverage.json

      # The badges branch holds only these files. The README reads them through shields.io.
      - name: Deploy badges
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: badges
          publish_dir: ./badges
          force_orphan: true
